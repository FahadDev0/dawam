<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>دوام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Rakkas&display=swap">
<style>
/* Layout: one phone-shaped game column — HUD, illustrated stage, place tabs, actions, dock; overlays stack above.
   Single committed look: Riyadh-night office (navy + saffron), sand-paper dialogue boxes. */
:root {
  --night: #0E1824; --panel: #162533; --panel2: #1E3245; --line: #2A4257;
  --ink: #EAF0F2; --muted: #8FA6B5; --saffron: #F2B43C; --saffron-d: #C98E1C;
  --sand: #F3E8D2; --sand-ink: #2A2118; --sand-line: #D9C7A4;
  --good: #57C78C; --bad: #E5566B; --blue: #5AA9E6;
  --display: "Rakkas", "Baloo Bhaijaan 2", serif;
  --ui: "Baloo Bhaijaan 2", system-ui, Tahoma, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #070D14; color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.55; direction: rtl; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
input { font: inherit; }
.ic { width: 22px; height: 22px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
#game { position: relative; height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: var(--night); box-shadow: 0 0 60px #000a; overflow: hidden; }

/* ---------- HUD ---------- */
.hud { padding: 8px 14px 8px; background: linear-gradient(#0B141E, var(--night)); display: grid; gap: 6px; z-index: 3; }
.hud-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.when { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.when b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--saffron); line-height: 1; }
.when span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.money { display: flex; align-items: center; gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px 2px 8px; font-weight: 700; font-size: 14px; }
.money .ic { width: 18px; height: 18px; color: var(--saffron); }
.meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.meter { display: flex; align-items: center; gap: 5px; min-width: 0; }
.meter .ic { width: 17px; height: 17px; color: var(--muted); }
.meter .bar { flex: 1; height: 7px; background: #0A121B; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.meter .bar i { display: block; height: 100%; border-radius: 6px; transition: width .5s cubic-bezier(.3,1.4,.5,1); }
.meter.energy i { background: linear-gradient(90deg, #F2B43C, #F6D27A); }
.meter.stress i { background: linear-gradient(90deg, #E5566B, #F08B6B); }
.meter.prog i { background: linear-gradient(90deg, #3FA877, #7FE0A8); }
.meter.rep i { background: linear-gradient(90deg, #4C8FD6, #8CC4F2); }
.meter.warn .ic { color: var(--bad); animation: pulse 1s infinite; }
.slots { display: flex; gap: 4px; }
.slots span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.slots .done { background: var(--muted); } .slots .now { background: var(--saffron); box-shadow: 0 0 6px var(--saffron); }

/* ---------- STAGE ---------- */
.stage { position: relative; flex: 1; min-height: 220px; overflow: hidden; }
.scene-wrap, .scene-wrap svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.tint { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; transition: background .6s; }
.loc-plate { position: absolute; top: 10px; right: 12px; background: #0E1824cc; backdrop-filter: blur(4px); border: 1px solid #ffffff1f; border-radius: 12px; padding: 4px 12px; z-index: 2; }
.loc-plate b { font-family: var(--display); font-weight: 400; font-size: 18px; display: block; line-height: 1.2; }
.loc-plate small { color: var(--muted); font-size: 12px; }
.hot { fill: transparent; cursor: pointer; }
.hot:hover { fill: #F2B43C22; }
.actors { position: absolute; inset: auto 0 0 0; height: 72%; display: flex; justify-content: center; align-items: flex-end; gap: 2%; padding-inline: 8px; pointer-events: none; z-index: 2; }
.actor { position: relative; flex: 0 1 42%; min-width: 0; max-width: 200px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; animation: enter .45s cubic-bezier(.2,1.3,.5,1) backwards; }
.actor:nth-child(2) { animation-delay: .07s; } .actor:nth-child(3) { animation-delay: .14s; }
.actor svg.pt { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 10px #0008); transition: transform .2s; }
.actor:hover svg.pt, .actor:focus-visible svg.pt { transform: translateY(-4px) scale(1.03); }
.actor .tag { position: absolute; bottom: 8px; background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.actor .tag em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 11px; margin-inline-start: 4px; }
.actor .bubble { position: absolute; top: -4%; left: 6%; width: 30px; height: 30px; background: #fff; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 3px 8px #0006; animation: bob 1.4s ease-in-out infinite; }
.actor .bubble svg { width: 20px; height: 20px; }
.hot-tip { position: absolute; left: 12px; right: 12px; top: 54px; z-index: 4; background: var(--sand); color: var(--sand-ink); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; box-shadow: 0 8px 24px #0007; animation: pop-in .25s ease-out; }
.hot-tip .row { display: flex; gap: 8px; margin-top: 8px; }
.hot-tip button { background: var(--sand-ink); color: var(--sand); border-radius: 10px; padding: 4px 14px; font-weight: 700; }
.hot-tip button.ghost { background: transparent; color: var(--sand-ink); border: 1.5px solid var(--sand-ink); }
.empty-stage { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: #ffffffb0; font-size: 13px; z-index: 2; text-shadow: 0 1px 4px #000; }

/* ---------- PLACES / ACTIONS / DOCK ---------- */
.locs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 6px; scrollbar-width: none; background: var(--night); border-top: 1px solid var(--line); }
.locs::-webkit-scrollbar { display: none; }
.loc-tab { flex: none; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 12px 7px; min-width: 96px; position: relative; transition: border-color .2s, transform .15s; }
.loc-tab:active { transform: scale(.97); }
.loc-tab b { font-size: 13.5px; white-space: nowrap; }
.loc-tab.on { border-color: var(--saffron); background: var(--panel2); }
.loc-tab .who { display: flex; height: 22px; }
.loc-tab .who svg { width: 22px; height: 22px; border-radius: 50%; margin-inline-end: -6px; border: 1.5px solid var(--panel); }
.loc-tab .none { font-size: 11px; color: var(--muted); line-height: 22px; }
.loc-tab .dot { position: absolute; top: 6px; left: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); box-shadow: 0 0 6px var(--saffron); }
.acts { display: flex; gap: 8px; padding: 4px 12px 8px; min-height: 52px; }
.act { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(var(--saffron), var(--saffron-d)); color: #241A08; border-radius: 14px; padding: 6px 10px; font-weight: 800; font-size: 14.5px; line-height: 1.2; box-shadow: 0 3px 0 #8A5F10; transition: transform .1s, box-shadow .1s; }
.act small { font-weight: 600; font-size: 11.5px; opacity: .75; }
.act:active { transform: translateY(3px); box-shadow: 0 0 0 #8A5F10; }
.act[disabled] { background: var(--panel2); color: var(--muted); box-shadow: none; cursor: default; }
.acts .hint { flex: 1; align-self: center; text-align: center; color: var(--muted); font-size: 13px; }
.dock { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: #0B141E; padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
.dock button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0; font-size: 11.5px; color: var(--muted); position: relative; border-radius: 10px; }
.dock button:hover { color: var(--ink); }
.dock .badge { position: absolute; top: 2px; left: calc(50% - 20px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; animation: pop-in .3s; }

/* ---------- OVERLAYS ---------- */
#layer > * { position: fixed; inset: 0; z-index: 20; }
.ov { display: flex; justify-content: center; }
.ov-inner { position: relative; width: 100%; max-width: 520px; height: 100%; }
.dim { background: #050a10b3; backdrop-filter: blur(2px); animation: fade .2s; }

/* visual-novel dialogue */
.vn .ov-inner { display: flex; flex-direction: column; justify-content: flex-end; }
.vn-por { position: absolute; bottom: 168px; left: 50%; width: min(74%, 340px); transform: translateX(-50%); transition: opacity .2s; }
.vn-por svg.pt { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 24px #000a); }
.vn-por.talk svg.pt { animation: talk .28s ease-in-out infinite alternate; }
.vn-por.shake { animation: shake .4s; }
.vn-por.hop { animation: hop .45s; }
.vn-por.dimmed { opacity: .45; }
.vn-emo { position: absolute; bottom: calc(168px + min(74vw, 340px) * 1.05); left: calc(50% + min(22vw, 100px)); width: 46px; height: 46px; background: #fff; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 4px 12px #0007; animation: emo 1.2s ease-out forwards; z-index: 3; }
.vn-emo svg { width: 30px; height: 30px; }
.vn-box { position: relative; margin: 0 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--sand); color: var(--sand-ink); border-radius: 18px; padding: 22px 16px 14px; min-height: 120px; box-shadow: 0 -2px 0 var(--sand-line) inset, 0 10px 30px #000a; z-index: 2; }
.vn-box::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--sand-line); border-radius: 14px; pointer-events: none; }
.vn-name { position: absolute; top: -16px; right: 18px; background: var(--c, var(--saffron)); color: #1A140C; border-radius: 10px; padding: 2px 14px; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 #0003; white-space: nowrap; }
.vn-name small { font-weight: 600; opacity: .7; font-size: 11.5px; margin-inline-start: 4px; }
.vn-text { font-size: 16.5px; line-height: 1.75; min-height: 58px; position: relative; }
.vn-text.narr { font-style: italic; color: #5E5140; font-size: 15.5px; }
.vn-text.me { color: #213A5C; }
.vn-next { position: absolute; left: 16px; bottom: 8px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid var(--sand-ink); animation: bob 1s infinite; }
.vn-skip { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 5; background: #0E1824cc; border: 1px solid var(--line); border-radius: 12px; padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
.vn-opts { display: flex; flex-direction: column; gap: 8px; margin: 0 14px 10px; z-index: 3; }
.opt { text-align: right; background: #0E1824ee; border: 1.5px solid var(--saffron); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 15px; font-weight: 600; animation: slide-in .3s backwards; display: flex; gap: 10px; align-items: center; }
.opt:nth-child(2) { animation-delay: .06s; } .opt:nth-child(3) { animation-delay: .12s; } .opt:nth-child(4) { animation-delay: .18s; }
.opt:hover, .opt:focus-visible { background: var(--saffron); color: #1A140C; }
.opt .ic { width: 20px; height: 20px; color: var(--saffron); }
.opt:hover .ic { color: #1A140C; }
.opt.locked { border-color: var(--line); color: var(--muted); cursor: default; }
.opt.locked:hover { background: #0E1824ee; color: var(--muted); }
.opt small { margin-inline-start: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
.hub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 14px 10px; z-index: 3; }
.hub .opt { justify-content: flex-start; }
.hub .opt.bye { grid-column: 1 / -1; justify-content: center; border-color: var(--muted); }
.picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 14px 10px; justify-content: center; z-index: 3; }
.picker button { width: 74px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #0E1824ee; border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 4px; font-size: 12px; animation: pop-in .25s backwards; }
.picker button:hover { border-color: var(--saffron); }
.picker svg { width: 46px; height: 46px; border-radius: 50%; }
.picker .itm { border-radius: 0; }
.picker em { font-style: normal; color: var(--saffron); font-size: 11px; }
.fx-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12.5px; font-weight: 700; padding: 1px 9px; border-radius: 20px; background: #fff8; border: 1px solid var(--sand-line); animation: pop-in .3s backwards; }
.chip.up { color: #1F7A4D; } .chip.down { color: #B3263E; }

/* chat (group & phone) */
.phone { display: flex; flex-direction: column; background: #0B141E; }
.ph-head { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.ph-head svg.pt { width: 38px; height: 38px; border-radius: 50%; }
.ph-head b { display: block; line-height: 1.2; } .ph-head small { color: var(--muted); font-size: 12px; }
.ph-head .x { padding: 6px; border-radius: 10px; }
#phX { margin-inline-start: auto; }
.ph-body { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; background: radial-gradient(circle at 20% 10%, #13283A, #0B141E 60%); }
.bub { max-width: 82%; padding: 7px 12px 8px; border-radius: 4px 16px 16px 16px; background: var(--panel2); align-self: flex-start; animation: bub-in .25s backwards; font-size: 15px; }
.bub .who { display: block; font-size: 11.5px; font-weight: 800; }
.bub.me { align-self: flex-end; background: #1F5E45; border-radius: 16px 4px 16px 16px; }
.bub.sys { align-self: center; background: #ffffff10; color: var(--muted); font-size: 12.5px; border-radius: 10px; text-align: center; max-width: 92%; }
.typing { align-self: flex-start; background: var(--panel2); border-radius: 16px; padding: 10px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bob .8s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.ph-foot { padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; background: var(--panel); border-top: 1px solid var(--line); }
.reply { text-align: right; background: var(--panel2); border: 1.5px solid #1F5E45; border-radius: 16px; padding: 8px 14px; animation: slide-in .25s backwards; }
.reply:hover { background: #1F5E45; }
.ph-home { flex: 1; padding: 18px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-content: start; background: radial-gradient(circle at 70% 0%, #26405A, #0B141E 70%); }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; position: relative; }
.app i { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; box-shadow: 0 6px 16px #0006; }
.app i .ic { width: 30px; height: 30px; color: #fff; }
.app .badge { position: absolute; top: -4px; left: calc(50% - 38px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.app[disabled] { opacity: .4; }
.ph-clock { grid-column: 1 / -1; text-align: center; padding: 6px 0 10px; }
.ph-clock b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; display: block; }
.ph-clock small { color: var(--muted); }
.list-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; width: 100%; }
.list-row svg.pt { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.list-row .t { flex: 1; min-width: 0; }
.list-row .t b { display: block; } .list-row .t span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .unread { width: 10px; height: 10px; border-radius: 50%; background: var(--good); flex: none; }
.mail { padding: 16px; } .mail h3 { margin: 0 0 4px; font-size: 18px; } .mail .from { color: var(--muted); font-size: 13px; margin-bottom: 12px; } .mail p { margin: 0 0 10px; }
.shop-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.shop-item svg.itm { width: 46px; height: 46px; flex: none; background: #ffffff10; border-radius: 12px; padding: 4px; }
.shop-item .t { flex: 1; min-width: 0; } .shop-item .t span { display: block; color: var(--muted); font-size: 12.5px; }
.buy { background: var(--saffron); color: #1A140C; font-weight: 800; border-radius: 12px; padding: 4px 12px; white-space: nowrap; }
.buy[disabled] { background: var(--panel2); color: var(--muted); }
.incoming { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 30%, #2B4A63, #070D14 75%); text-align: center; }
.incoming .ring-por { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; animation: ringpulse 1.2s infinite; }
.incoming .ring-por svg { width: 100%; height: 100%; }
.incoming h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0; }
.incoming .btns { display: flex; gap: 46px; margin-top: 24px; }
.incoming .btns button { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; }
.incoming .yes { background: var(--good); animation: hop 1s infinite; } .incoming .no { background: var(--bad); }
.incoming .no .ic { transform: rotate(135deg); }

/* sheets (relations, bag, achievements, settings) */
.sheet { position: absolute; inset: auto 0 0 0; max-height: 86%; background: var(--panel); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2,1,.4,1); box-shadow: 0 -10px 40px #000a; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.sheet-h h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--saffron); }
.sheet-b { overflow-y: auto; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.rel { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rel svg.pt { width: 54px; height: 54px; flex: none; border-radius: 50%; }
.rel .t { flex: 1; min-width: 0; }
.rel .top { display: flex; justify-content: space-between; gap: 8px; }
.rel .top span { color: var(--muted); font-size: 12.5px; }
.hearts { display: flex; gap: 3px; margin: 3px 0; }
.hearts svg { width: 16px; height: 16px; }
.facts { margin: 2px 0 0; padding: 0 16px 0 0; color: var(--muted); font-size: 13px; }
.ach { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ach i { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--panel2); color: var(--muted); flex: none; }
.ach.got i { background: linear-gradient(var(--saffron), var(--saffron-d)); color: #241A08; }
.ach span { display: block; color: var(--muted); font-size: 12.5px; }
.ends { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.ends span { font-size: 12.5px; padding: 2px 10px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); }
.ends span.got { border-style: solid; border-color: var(--saffron); color: var(--saffron); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row label { display: flex; align-items: center; gap: 10px; }
.tog { width: 50px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.tog::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.tog.on { background: var(--good); } .tog.on::after { transform: translateX(-22px); }
.seg { display: flex; background: var(--night); border-radius: 12px; padding: 3px; }
.seg button { padding: 3px 12px; border-radius: 9px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--saffron); color: #1A140C; font-weight: 800; }
.btn { display: block; width: 100%; text-align: center; background: linear-gradient(var(--saffron), var(--saffron-d)); color: #241A08; font-weight: 800; border-radius: 16px; padding: 12px; font-size: 16px; box-shadow: 0 4px 0 #8A5F10; }
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }

<div id="game"></div>
<div id="layer"></div>
<script>
/* ===== AUDIO: everything synthesized with WebAudio (no files) ===== */
const SET = { music: true, sfx: true, haptics: true, speed: 1 };
try { Object.assign(SET, JSON.parse(localStorage.getItem("dawam2-set") || "{}")); } catch (e) {}
function saveSet() { try { localStorage.setItem("dawam2-set", JSON.stringify(SET)); } catch (e) {} }

function haptic(p) {
  if (!SET.haptics) return;
  try {
    if (window.AndroidHaptics) window.AndroidHaptics.vibrate(Array.isArray(p) ? p[0] : p);
    else if (navigator.vibrate) navigator.vibrate(p);
  } catch (e) {}
}

const SND = (() => {
  let ctx, master, musG, sfxG, ambG, noise, pendingTheme = null, pendingAmb = null;
  let lastVoice = 0;

  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ctx.destination);
    musG = ctx.createGain(); musG.gain.value = SET.music ? 0.3 : 0; musG.connect(master);
    sfxG = ctx.createGain(); sfxG.gain.value = SET.sfx ? 0.85 : 0; sfxG.connect(master);
    ambG = ctx.createGain(); ambG.gain.value = SET.sfx ? 0.55 : 0; ambG.connect(master);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (pendingTheme) { const t = pendingTheme; pendingTheme = null; music(t); }
    if (pendingAmb) { const a = pendingAmb; pendingAmb = null; amb(a); }
    document.addEventListener("visibilitychange", () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else ctx.resume();
    });
  }
  function apply() {
    if (!ctx) return;
    const t = ctx.currentTime;
    musG.gain.setTargetAtTime(SET.music ? 0.3 : 0, t, 0.1);
    sfxG.gain.setTargetAtTime(SET.sfx ? 0.85 : 0, t, 0.05);
    ambG.gain.setTargetAtTime(SET.sfx ? 0.55 : 0, t, 0.1);
  }

  /* --- primitives --- */
  function tone(f, at, dur, o = {}) {
    if (!ctx) return;
    const t0 = ctx.currentTime + (at || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(f, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t0 + dur);
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.25 : o.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = osc;
    if (o.lp) { const f2 = ctx.createBiquadFilter(); f2.type = "lowpass"; f2.frequency.value = o.lp; osc.connect(f2); node = f2; }
    node.connect(g); g.connect(o.dest || sfxG);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function burst(at, dur, o = {}) {
    if (!ctx) return;
    const t0 = ctx.currentTime + (at || 0);
    const src = ctx.createBufferSource(); src.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = o.ft || "bandpass";
    f.frequency.setValueAtTime(o.f || 1200, t0);
    if (o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo, t0 + dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain(), v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || sfxG);
    src.start(t0, Math.random() * 1.5); src.stop(t0 + dur + 0.05);
  }

  /* --- sound effects --- */
  const FX = {
    click: () => tone(880, 0, 0.05, { type: "triangle", vol: 0.12 }),
    select: () => { tone(523, 0, 0.08, { type: "triangle", vol: 0.15 }); tone(784, 0.06, 0.1, { type: "triangle", vol: 0.15 }); },
    back: () => { tone(587, 0, 0.07, { type: "triangle", vol: 0.12 }); tone(392, 0.06, 0.1, { type: "triangle", vol: 0.12 }); },
    open: () => burst(0, 0.2, { f: 500, fTo: 2400, vol: 0.1, q: 0.8 }),
    close: () => burst(0, 0.18, { f: 2200, fTo: 500, vol: 0.08, q: 0.8 }),
    notify: () => { tone(988, 0, 0.18, { vol: 0.2 }); tone(1976, 0, 0.12, { vol: 0.04 }); tone(1319, 0.11, 0.3, { vol: 0.2 }); haptic(30); },
    heart: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.055, 0.22, { type: "triangle", vol: 0.12 })),
    drop: () => { tone(260, 0, 0.35, { slide: 110, vol: 0.2, type: "triangle" }); burst(0.02, 0.2, { ft: "lowpass", f: 400, vol: 0.06 }); },
    stress: () => { tone(62, 0, 0.16, { vol: 0.5 }); tone(58, 0.2, 0.2, { vol: 0.4 }); haptic([20, 60, 20]); },
    success: () => [523, 659, 784, 1047].forEach((f, i) => { tone(f, i * 0.09, 0.5, { type: "triangle", vol: 0.16 }); tone(f / 2, i * 0.09, 0.4, { type: "square", vol: 0.03, lp: 1200 }); }),
    fail: () => [392, 370, 349, 311].forEach((f, i) => tone(f, i * 0.2, i === 3 ? 0.7 : 0.22, { type: "sawtooth", vol: 0.08, lp: 900 })),
    squash: () => { burst(0, 0.09, { ft: "lowpass", f: 1400, vol: 0.35 }); tone(190, 0, 0.12, { slide: 55, vol: 0.3 }); haptic(25); },
    buzz: () => { tone(140, 0, 0.18, { type: "square", vol: 0.1, lp: 700 }); haptic([40, 30, 40]); },
    tick: () => tone(1600, 0, 0.025, { vol: 0.05 }),
    coin: () => { tone(988, 0, 0.07, { type: "square", vol: 0.07, lp: 3000 }); tone(1319, 0.07, 0.2, { type: "square", vol: 0.07, lp: 3000 }); },
    achieve: () => { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, i * 0.07, 1.1, { vol: 0.1 })); burst(0.1, 0.6, { f: 6000, q: 4, vol: 0.03 }); haptic([30, 40, 60]); },
    day: () => { tone(880, 0, 1.3, { vol: 0.18 }); tone(1760, 0, 0.8, { vol: 0.03 }); tone(659, 0.35, 1.5, { vol: 0.16 }); },
    type: () => burst(0, 0.025, { ft: "highpass", f: 2500 + Math.random() * 2000, vol: 0.05 + Math.random() * 0.04 }),
    stamp: () => { tone(95, 0, 0.25, { slide: 40, vol: 0.6 }); burst(0, 0.12, { ft: "lowpass", f: 600, vol: 0.3 }); haptic(60); },
    gift: () => [659, 880, 1109, 1319].forEach((f, i) => tone(f, i * 0.08, 0.4, { vol: 0.12 })),
    munch: () => [0, 0.12, 0.24].forEach(t => burst(t, 0.06, { ft: "lowpass", f: 900, vol: 0.2 })),
    coo: () => { tone(520, 0, 0.18, { slide: 420, vol: 0.1 }); tone(480, 0.22, 0.25, { slide: 400, vol: 0.1 }); },
    radio: () => burst(0, 0.6, { f: 1800, q: 2, vol: 0.06 }),
    crackle: () => { for (let i = 0; i < 6; i++) burst(Math.random() * 0.5, 0.02, { ft: "highpass", f: 3000, vol: 0.12 }); },
    swoosh: () => burst(0, 0.3, { f: 300, fTo: 3000, q: 2, vol: 0.08 }),
    pop: () => tone(660, 0, 0.06, { slide: 1200, vol: 0.12, type: "triangle" }),
    sip: () => burst(0, 0.25, { f: 900, fTo: 1600, q: 3, vol: 0.07 }),
  };
  function play(n) { if (!ctx || !SET.sfx) return; try { FX[n] && FX[n](); } catch (e) {} }

  /* typewriter "voices": every character has its own pitch & timbre */
  function voice(v) {
    if (!ctx || !SET.sfx || !v) return;
    const now = performance.now();
    if (now - lastVoice < 45) return;
    lastVoice = now;
    const f = v.f * (1 + (Math.random() - 0.5) * (v.v || 0.15));
    tone(f, 0, 0.055, { type: v.w || "triangle", vol: v.vol || 0.06, lp: 2400 });
  }
  function beep(i) { if (!ctx) return; const fs = [330, 440, 554, 659]; tone(fs[i], 0, 0.32, { type: "triangle", vol: 0.2 }); }

  /* continuous pour sound for the tea mini-game */
  function pour() {
    if (!ctx || !SET.sfx) return { set() {}, stop() {} };
    const src = ctx.createBufferSource(); src.buffer = noise; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 6; f.frequency.value = 500;
    const g = ctx.createGain(); g.gain.value = 0.0001;
    src.connect(f); f.connect(g); g.connect(sfxG); src.start();
    g.gain.setTargetAtTime(0.18, ctx.currentTime, 0.03);
    return {
      set(level) { f.frequency.setTargetAtTime(450 + level * 1300, ctx.currentTime, 0.05); },
      stop() { g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.04); src.stop(ctx.currentTime + 0.3); }
    };
  }

  /* phone ringing */
  let ringT = null;
  function ring(on) {
    clearInterval(ringT); ringT = null;
    if (!on) return;
    const once = () => {
      for (let i = 0; i < 8; i++) tone(i % 2 ? 480 : 440, i * 0.12, 0.11, { vol: 0.12 });
      haptic([300, 150, 300]);
    };
    once(); ringT = setInterval(once, 2400);
  }

  /* ===== procedural maqam music ===== */
  const THEMES = {

function launchNode() {
  const p = G.prog, F = G.flags;
  const L = ["#قاعة الإبداع. نائب الرئيس في الصف الأول. أبو فيصل يعرق، والمكيف على ١٦.", "#ريتشارد يفتح العرض."];
  if (F.reem_copresent) L.push("reem:h|(توقف العرض) قبل الأرقام، خلّونا نشوف شي.", "#فيديو العم من بريدة: يضغط زر واحد. يطلع «تم الدفع». يضحك. القاعة كلها تضحك معه.");
  if (p >= 100) L.push("#تضغط «إطلاق». الطلبات تدخل: ١٠، ١٠٠، ٢٠٠٠. ولا خطأ واحد في اللوقات.", "nouf:h|(تهز راسها لك. هذا أعلى وسام في الشركة.)");
  else if (p >= 75) L.push("#تضغط «إطلاق». الخدمة تشتغل… بس الدفع يعلّق مع بعض البنوك.", "boss:x|هذا مقصود! إطلاق… تدريجي.", "#محد صدّقه. الكل هز راسه.");
  else L.push("#تضغط «إطلاق». الصفحة تحمّل. وتحمّل. وتحمّل.", "richard:x|Aaand… let's look at Lessons Learned!");
  return { id: "launch", npc: "boss", k: "ev", L, c: [{ t: "(تاخذ نفس عميق)", fx: {} }] };
}

let G = null;
const META = { ach: {}, ends: {}, runs: 0 };
try { Object.assign(META, JSON.parse(localStorage.getItem(META_KEY) || "{}")); } catch (e) {}

function fresh(name) {

    v: 2, name: name || "عبدالله", day: 1, slot: 0, energy: 80, stress: 20, prog: 0, rep: 50, money: 340,

    texts: [], mails: [], st: { meetings: 0, bugs: 0, gifts: 0, wfh: 0, calls: 0, hots: {} },

    log: [], phase: "play", endKey: null, evDone: {}, weekend: false, ach: {},
  };
}
function save() { try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function loadSave() { try { const g = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); return g && g.v === 2 ? g : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ar = n => new Intl.NumberFormat("ar-SA-u-nu-arab").format(n);
const A = id => (G.aff[id] || 0);
const byId = id => N.find(n => n.id === id);
function level(v) { return v <= -30 ? "متوترة" : v < 0 ? "باردة" : v < 15 ? "زميل" : v < 35 ? "معرفة طيبة" : v < 60 ? "صديق" : "حليف"; }
const hasF = f => !f || [].concat(f).every(x => G.flags[x]);
const noF = f => !f || [].concat(f).every(x => !G.flags[x]);

function ok(n, loc) {
  if (n.a != null && A(n.npc) < n.a) return false;
  if (n.am != null && A(n.npc) > n.am) return false;
  if (n.d != null && G.day < n.d) return false;
  if (n.dm != null && G.day > n.dm) return false;
  if (!hasF(n.f) || !noF(n.nf)) return false;
  if (!n.rep && G.seen[n.id]) return false;
  if (n.at && n.at !== loc) return false;
  return true;
}
function talkPool(npc, loc) { return N.filter(n => n.npc === npc && (!n.k || n.k === "call") && ok(n, loc)); }
function pickTalk(npc, loc) {
  const pool = talkPool(npc, loc);
  if (!pool.length) return null;
  const atLoc = pool.filter(n => n.at === loc), src = atLoc.length ? atLoc : pool;
  const story = src.filter(n => !n.rep);
  if (story.length) { const mx = Math.max(...story.map(n => n.p || 0)); const top = story.filter(n => (n.p || 0) === mx); return top[Math.random() * top.length | 0]; }
  const unseen = src.filter(n => !G.seen[n.id]), c = unseen.length ? unseen : src;
  return c[Math.random() * c.length | 0];
}
const hasNew = (npc, loc) => talkPool(npc, loc).some(n => !n.rep);

const STATN = { energy: "الطاقة", stress: "الضغط", prog: "التقدّم", rep: "السمعة" };
function applyFx(fx) {
  const out = [];
  if (!fx) return out;
  for (const [k, v] of Object.entries(fx)) {
    if (k === "set") { [].concat(v).filter(Boolean).forEach(f => G.flags[f] = true); continue; }
    if (k === "unset") { [].concat(v).forEach(f => delete G.flags[f]); continue; }
    if (k === "ach") { unlock(v); continue; }
    if (k === "give") { G.inv[v] = (G.inv[v] || 0) + 1; continue; }
    if (k === "skip" || k === "mg") continue;
    if (k === "money") { G.money = Math.max(0, G.money + v); out.push({ k, t: "ر.س", v, good: v > 0 }); continue; }
    if (STATN[k]) {
      let val = v;
      if (k === "prog" && v > 0 && !G.flags.db_access && G.prog + v > 70) val = Math.max(0, 70 - G.prog);
      const b = G[k]; G[k] = clamp(b + val, 0, 100); const d = G[k] - b;
      if (d) out.push({ k, t: STATN[k], v: d, good: k === "stress" ? d < 0 : d > 0 });
      continue;
    }
    if (G.aff[k] != null) {
      const b = G.aff[k]; G.aff[k] = clamp(b + v, -100, 100); const d = G.aff[k] - b;
      if (d) out.push({ k, t: CH[k].n, v: d, good: d > 0, npc: 1 });
    }
  }
  checkAch();
  return out;
}

function unlock(id) {
  if (!ACH[id] || G.ach[id]) return;
  G.ach[id] = 1;
  const first = !META.ach[id];
  META.ach[id] = 1; saveMeta();
  if (typeof UI !== "undefined") UI.achToast(id, first);
}
function checkAch() {
  const s = G.st;
  if (s.meetings >= 5) unlock("meetings");
  if (s.bugs >= 40) unlock("bugs");
  if (s.gifts >= 5) unlock("gifts");
  if (s.wfh >= 3) unlock("owl");
  if (s.calls >= 4) unlock("mom");
  if (Object.keys(s.hots).length >= 15) unlock("explorer");
  if (G.stress <= 0) unlock("zen");
  if (G.money < 20) unlock("broke");
  if (NPCS.some(k => G.aff[k] >= 60)) unlock("ally");
  if (OFFICE.every(k => G.aff[k] >= 15)) unlock("friends");
}
function logLine(t, ch) { G.log.unshift({ d: G.day, s: G.slot, t, ch: ch || [] }); G.log = G.log.slice(0, 30); }

/* ---- phone delivery ---- */
function needOk(need) {
  if (!need) return true;
  for (const [k, v] of Object.entries(need)) { if (k === "f") { if (!hasF(v)) return false; } else if (A(k) < v) return false; }
  return true;
}
function deliver() {
  const got = [];
  for (const t of TEXTS) {
    if (G.texts.some(x => x.id === t.id)) continue;
    if (t.d > G.day || (t.d === G.day && t.s > G.slot) || G.day > t.d + 1 || !needOk(t.need)) continue;
    G.texts.push({ id: t.id, read: false, done: !t.c, pick: null });
    if (t.fx) applyFx(t.fx);
    got.push({ type: "text", from: t.from });
  }
  for (const m of EMAILS) {
    if (G.mails.some(x => x.id === m.id) || m.d > G.day) continue;
    G.mails.unshift({ id: m.id, read: false, done: !m.c });
    got.push({ type: "mail" });
  }
  return got;
}
const unreadTexts = () => G.texts.filter(t => !t.read).length;
const unreadMails = () => G.mails.filter(m => !m.read).length;

function pickRandomEvent() {
  if (G.slot === 0 || G.slot === 3 || Math.random() > 0.33) return null;
  const pool = N.filter(n => n.k === "rand" && ok(n));
  return pool.length ? pool[Math.random() * pool.length | 0] : null;
}
function pickIncomingCall() {
  if (G.slot !== 3 || G.day < 2 || G.callDay === G.day || Math.random() > 0.35) return null;
  return pickTalk("mom");
}

/* ---- actions ---- */
function workFx(score, home) {
  let g = 5 + Math.floor(G.energy / 18);
  if (G.flags.nouf_mentor) g += 3;
  if (G.flags.sultan_task) g += 2;
  if (G.flags.yousef_mentor) g += 2;
  if (G.flags.saw_users) g += 1;
  if (G.flags.boss_ally) g += 1;
  if (G.energy < 20) g = Math.ceil(g / 2);
  g = Math.max(1, Math.round(g * (0.6 + 0.8 * score)));
  return home ? { prog: g, energy: -10, stress: 15 - Math.round(score * 4) } : { prog: g, energy: -12, stress: Math.round(10 - score * 5) };
}
const progBlocked = () => !G.flags.db_access && G.prog >= 70;

function giftReaction(npc, item) {
  const c = CH[npc];
  if (c.loves === item) return { d: 15, ex: "h", emo: "heart", txt: "يحب" };
  if ((c.likes || []).includes(item)) return { d: 8, ex: "h", emo: "spark", txt: "يحب" };
  if ((c.hates || []).includes(item)) return { d: -6, ex: "a", emo: "anger", txt: "ما يحب" };
  return { d: 3, ex: "n", emo: "note", txt: "" };
}
function giveGift(npc, item) {
  if (!G.inv[item]) return null;
  G.inv[item]--; G.st.gifts++; G.giftDay[npc] = G.day;
  const r = giftReaction(npc, item);
  if (npc === "abunayef" && item === "tamr") G.flags.gave_tamr = true;
  if (r.txt) { const f = `${r.txt} ${ITEMS[item].n}`; G.facts[npc] = [...new Set([...(G.facts[npc] || []), f])]; }
  r.ch = applyFx({ [npc]: r.d });
  return r;
}
function buy(item) {
  const it = ITEMS[item];
  if (G.money < it.p) return false;
  G.money -= it.p; G.inv[item] = (G.inv[item] || 0) + 1; checkAch();
  return true;
}
function askAbout(a, b) {
  const open = CH[a].guard === null || A(a) >= 15;
  if (!open) return { line: "n|" + CH[a].guard, open: false };
  const ln = OPIN[a][b];
  applyFx({ [a]: 1 });
  return { line: /^[nhasx]\|/.test(ln) ? ln : "n|" + ln, open: true };
}

function doWeekend(i) {

/* ---- time ---- */
function night() {
  const sleep = G.flags._early ? 48 : 30; delete G.flags._early;
  G.energy = clamp(G.energy + sleep, 0, 100);
  G.stress = clamp(G.stress + (G.day >= 7 ? 6 : G.day >= 4 ? 3 : -2) - (G.flags.standup_cut ? 2 : 0), 0, 100);
  if (G.day === 1) unlock("first_day");
  G.day++; G.slot = 0; G.hotDay = {};
}
function recordEnding(k) {

  META.ends[k] = 1; META.runs = (META.runs || 0) + 1; saveMeta();

/* ===== MINI-GAMES: each returns a Promise that resolves to a score 0..1 ===== */
const MG = (() => {
  const layer = () => document.getElementById("layer");
  function shell(title, tip, timed = true) {
    const el = document.createElement("div");
    el.className = "mg";
    el.innerHTML = `<div class="mg-h"><h2>${title}</h2><span class="stat num" id="mgS"></span></div>
      ${timed ? `<div class="mg-timer"><i id="mgT" style="width:100%"></i></div>` : ""}
      <div class="mg-tip">${tip}</div><div class="mg-arena" id="mgA"></div>
      <div class="mg-foot"><button class="btn ghost" id="mgSkip">تخطّي</button></div>`;
    layer().appendChild(el);
    return el;
  }
  function finish(el, score, line, resolve, stop) {
    if (el._done) return; el._done = true; stop && stop();
    score = Math.max(0, Math.min(1, score));
    const r = document.createElement("div");
    r.className = "mg-res";
    r.innerHTML = `<b class="num">${ar(Math.round(score * 100))}٪</b><div>${line}</div><button class="btn" style="max-width:240px">تمام</button>`;
    el.appendChild(r);
    SND.play(score >= 0.6 ? "success" : "fail");
    r.querySelector("button").onclick = () => { SND.play("click"); el.remove(); resolve(score); };
    r.querySelector("button").focus();
  }
  function skip(el, resolve, stop) {
    el.querySelector("#mgSkip").onclick = () => { if (el._done) return; el._done = true; stop && stop(); SND.play("back"); el.remove(); resolve(0.5); };
  }
  const bugSvg = c => `<svg viewBox="0 0 40 40"><g stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"><path d="M10 14 4 10M10 20H3M10 26l-6 4M30 14l6-4M30 20h7M30 26l6 4M16 8l-3-5M24 8l3-5"/></g><ellipse cx="20" cy="22" rx="11" ry="13" fill="${c}"/><path d="M20 10v25" stroke="#0004" stroke-width="2"/><circle cx="20" cy="10" r="6" fill="#2b2b2b"/><circle cx="17.5" cy="9" r="1.6" fill="#fff"/><circle cx="22.5" cy="9" r="1.6" fill="#fff"/></svg>`;

  /* 1) squash the bugs (work) */
  function bugs(o = {}) {
    return new Promise(res => {
      const el = shell("اسحق الباقات", "اضغط على الباقات قبل تختفي. لا تضغط على أبو فيصل!");
      const A = el.querySelector("#mgA"), S = el.querySelector("#mgS"), T = el.querySelector("#mgT");
      A.innerHTML = `<div class="bug-grid">${Array.from({ length: 9 }, () => `<div class="cell"><div class="code">${Array.from({ length: 6 }, () => `<i style="width:${30 + Math.random() * 60}%;background:${["#7FD1AE", "#F2B43C", "#8FB8F2", "#E58FA3"][Math.random() * 4 | 0]}"></i>`).join("")}</div></div>`).join("")}</div>`;
      const cells = [...A.querySelectorAll(".cell")];
      const DUR = 15000; let t0 = performance.now(), last = t0, acc = 0, hits = 0, spawned = 0, pings = 0, raf;
      const busy = new Set();
      const upd = () => S.textContent = `${ar(hits)} 🐞`;
      upd();
      function spawn() {
        const free = cells.map((c, i) => i).filter(i => !busy.has(i));
        if (!free.length) return;
        const i = free[Math.random() * free.length | 0], cell = cells[i];
        const isPing = Math.random() < 0.16;
        const d = document.createElement("button");
        d.className = isPing ? "ping" : "bug";
        d.innerHTML = isPing ? `${ART.portrait("boss", "n", { round: 1 })}<span class="lbl">عندك دقيقة؟</span>` : bugSvg(["#E5566B", "#57C78C", "#F2B43C", "#B07AE8"][Math.random() * 4 | 0]);
        d.setAttribute("aria-label", isPing ? "أبو فيصل" : "باق");
        busy.add(i); cell.appendChild(d);
        if (!isPing) spawned++;
        const life = setTimeout(() => { d.remove(); busy.delete(i); }, isPing ? 1300 : Math.max(700, 1150 - (performance.now() - t0) / 40));
        d.addEventListener("pointerdown", e => {
          e.preventDefault(); clearTimeout(life);
          if (isPing) { pings++; SND.play("buzz"); toastMini(el, "«عندك دقيقة؟» راحت ٣ ثواني"); t0 -= 3000; d.remove(); busy.delete(i); }
          else { hits++; SND.play("squash"); d.classList.add("dead"); setTimeout(() => { d.remove(); busy.delete(i); }, 260); }
          upd();
        }, { once: true });
      }
      function loop(now) {
        const el2 = now - t0; acc += now - last; last = now;
        const every = Math.max(380, 720 - el2 / 30);
        while (acc > every) { acc -= every; spawn(); }
        T.style.width = Math.max(0, 100 - el2 / DUR * 100) + "%";
        if (el2 >= DUR) {
          const sc = spawned ? hits / spawned - pings * 0.08 : 0;
          G.st.bugs += hits; checkAch();
          return finish(el, sc, `سحقت ${ar(hits)} من ${ar(spawned)} باق${pings ? ` · قاطعك المدير ${ar(pings)} مرات` : ""}`, res, stop);
        }
        raf = requestAnimationFrame(loop);
      }
      const stop = () => cancelAnimationFrame(raf);
      skip(el, res, stop);
      raf = requestAnimationFrame(loop);
    });
  }
  function toastMini(el, t) { const s = el.querySelector(".mg-tip"); s.textContent = t; s.style.color = "var(--bad)"; setTimeout(() => { s.style.color = ""; }, 900); }

  /* 2) tea pour (buffet) */
  function pour(o = {}) {
    return new Promise(res => {
      const el = shell("الصبّة", "اضغط مطوّل للصب، وفك عند الخط الأخضر. ٣ بيالات.", false);
      const A = el.querySelector("#mgA"), S = el.querySelector("#mgS");
      A.innerHTML = `<div class="pour-wrap"><div class="cups-row"><span></span><span></span><span></span></div>
        <svg class="pot" viewBox="0 0 120 90"><path d="M22 34h58a6 6 0 0 1 6 6v8c0 18-14 30-35 30S16 66 16 48v-8a6 6 0 0 1 6-6z" fill="#C9A34E"/><path d="M86 44q22-8 30-26" stroke="#C9A34E" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M16 46q-14 2-12 14t16 8" stroke="#A8862E" stroke-width="6" fill="none"/><rect x="38" y="22" width="26" height="12" rx="4" fill="#E2C273"/><circle cx="51" cy="18" r="5" fill="#A8862E"/></svg>
        <div style="position:relative"><div class="stream" id="stream" style="height:46px;top:-50px"></div><div class="cup"><div class="band" id="band"></div><div class="tea" id="tea" style="height:0"></div></div></div>
        <button class="btn" id="hold" style="max-width:280px;touch-action:none">اضغط مطوّل للصب</button></div>`;
      const tea = A.querySelector("#tea"), band = A.querySelector("#band"), pot = A.querySelector(".pot"), stream = A.querySelector("#stream"), hold = A.querySelector("#hold"), dots = A.querySelectorAll(".cups-row span");
      let cup = 0, level = 0, pouring = false, raf, last = 0, snd = null, scores = [], target = 0;
      function newCup() { level = 0; tea.style.height = "0%"; target = 58 + Math.random() * 22; band.style.bottom = (target - 6) + "%"; band.style.height = "12%"; }
      newCup();
      function loop(now) {
        const dt = last ? (now - last) / 1000 : 0; last = now;
        if (pouring) { level += dt * (26 + level * 0.55); tea.style.height = Math.min(level, 100) + "%"; snd && snd.set(level / 100); if (level >= 104) release(); }
        raf = requestAnimationFrame(loop);
      }
      function press(e) { e.preventDefault(); if (pouring || cup >= 3) return; pouring = true; pot.classList.add("tilt"); stream.classList.add("on"); snd = SND.pour(); haptic(15); }
      function release() {
        if (!pouring) return; pouring = false; pot.classList.remove("tilt"); stream.classList.remove("on"); snd && snd.stop(); snd = null;
        const dist = Math.abs(level - target);
        const sc = level > 100 ? 0 : dist <= 6 ? 1 - dist / 30 : Math.max(0, 0.6 - (dist - 6) / 30);
        scores.push(sc); dots[cup].classList.add("done");
        SND.play(level > 100 ? "buzz" : sc > 0.85 ? "heart" : "sip");
        S.textContent = level > 100 ? "انكبّ!" : sc > 0.9 ? "مثالية!" : sc > 0.6 ? "زينة" : "مو مضبوطة";
        cup++;
        if (cup >= 3) {
          const avg = scores.reduce((a, b) => a + b, 0) / 3;
          if (avg >= 0.95) unlock("pour");
          setTimeout(() => finish(el, avg, avg > 0.85 ? "العم مبارك يهز راسه بإعجاب" : avg > 0.5 ? "شاي يمشي الحال" : "العم مبارك يطالعك بصمت", res, stop), 500);
        } else setTimeout(newCup, 450);
      }
      hold.addEventListener("pointerdown", press);
      hold.addEventListener("pointerup", release);
      hold.addEventListener("pointerleave", release);
      hold.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) press(e); });
      hold.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") release(); });
      const stop = () => { cancelAnimationFrame(raf); snd && snd.stop(); };
      skip(el, res, stop);
      raf = requestAnimationFrame(loop);
    });
  }

  /* 3) buzzword bingo (meetings) */
  const WORDS = ["synergy", "KPI", "agile", "roadmap", "alignment", "ecosystem", "quick win", "deep dive", "low-hanging fruit", "holistic", "مرحلة ثانية", "تمكين", "رحلة المستفيد", "تحوّل رقمي", "مواءمة", "استدامة", "نقلة نوعية", "outside the box"];
  function bingo(o = {}) {
    return new Promise(res => {
      const el = shell("بنغو الاجتماع", "اضغط الكلمة الطايرة إذا كانت في بطاقتك. كمّل صف!");
      const A = el.querySelector("#mgA"), S = el.querySelector("#mgS"), T = el.querySelector("#mgT");
      const pool = [...WORDS].sort(() => Math.random() - 0.5), card = pool.slice(0, 9), decoys = pool.slice(9);
      const hit = new Array(9).fill(false);
      A.innerHTML = `<div class="bingo">${card.map((w, i) => `<div data-i="${i}">${w}</div>`).join("")}</div><div class="lane" id="lane"></div>`;
      const lane = A.querySelector("#lane"), cells = A.querySelectorAll(".bingo div");
      const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
      const DUR = 22000; let t0 = performance.now(), last = t0, acc = 700, raf, words = [], misses = 0;
      const lines = () => LINES.filter(l => l.every(i => hit[i]));
      const upd = () => { const L = lines(); S.textContent = `${ar(hit.filter(Boolean).length)}/٩ · ${ar(L.length)} صف`; L.flat().forEach(i => cells[i].classList.add("line")); };
      upd();
      function spawn() {
        const open = card.filter((w, i) => !hit[i]);
        const w = Math.random() < 0.62 && open.length ? open[Math.random() * open.length | 0] : decoys[Math.random() * decoys.length | 0];
        const b = document.createElement("button");
        b.className = "word"; b.textContent = w;
        const y = 8 + Math.random() * 100;
        b.style.top = y + "px"; b.style.left = "-160px";
        lane.appendChild(b);
        const obj = { b, x: -160, v: 70 + Math.random() * 50 + (performance.now() - t0) / 400, w, done: false };
        words.push(obj);
        b.addEventListener("pointerdown", e => {
          e.preventDefault(); if (obj.done) return; obj.done = true;
          const i = card.indexOf(w);
          if (i >= 0 && !hit[i]) { const before = lines().length; hit[i] = true; cells[i].classList.add("hit"); b.classList.add("hit"); SND.play("pop"); upd(); if (lines().length > before) { SND.play("success"); haptic([30, 40, 30]); if (!before) unlock("bingo"); } }
          else { misses++; b.classList.add("miss"); SND.play("buzz"); }
          setTimeout(() => b.remove(), 250);
        });
      }
      function loop(now) {
        const dt = (now - last) / 1000; last = now; acc += now - (loop.p || now); loop.p = now;
        const t = now - t0;
        if (acc > 900) { acc = 0; spawn(); }
        const W = lane.clientWidth;
        words.forEach(o => { if (o.done && !o.b.isConnected) return; o.x += o.v * dt; o.b.style.left = o.x + "px"; if (o.x > W + 10) { o.b.remove(); o.done = true; } });
        words = words.filter(o => o.b.isConnected);
        T.style.width = Math.max(0, 100 - t / DUR * 100) + "%";
        if (t >= DUR) {
          const L = lines().length, m = hit.filter(Boolean).length;
          const sc = L ? Math.min(1, 0.65 + 0.2 * (L - 1) + m * 0.02) - misses * 0.04 : m / 9 * 0.55 - misses * 0.03;
          return finish(el, sc, L ? `بنغو! ${ar(L)} صف. والكل يحسبك منتبه` : `علّمت ${ar(m)} كلمات. الاجتماع مستمر`, res, stop);
        }
        raf = requestAnimationFrame(loop);
      }
      const stop = () => cancelAnimationFrame(raf);
      skip(el, res, stop);
      raf = requestAnimationFrame(loop);
    });
  }

  /* 4) server memory (Simon) */
  function simon(o = {}) {
    return new Promise(res => {
      const el = shell("فحص السيرفر", "شوف ترتيب الأضواء، وكرّره. ٤ جولات.", false);
      const A = el.querySelector("#mgA"), S = el.querySelector("#mgS");
      const COL = ["#45D18A", "#F2B43C", "#5AA9E6", "#E5566B"];
      A.innerHTML = `<div class="leds">${COL.map((c, i) => `<button data-i="${i}" style="background:${c};color:${c}" aria-label="ضوء ${i + 1}"></button>`).join("")}</div><div class="mg-tip" id="sTip">انتبه…</div>`;
      const btns = [...A.querySelectorAll(".leds button")], tip = A.querySelector("#sTip");
      let seq = [], round = 0, input = 0, accepting = false, ended = false, timers = [];
      const later = (fn, ms) => timers.push(setTimeout(fn, ms));
      const flash = i => { btns[i].classList.add("lit"); SND.beep(i); later(() => btns[i].classList.remove("lit"), 330); };
      function next() {
        if (ended) return;
        round++; input = 0; accepting = false;
        S.textContent = `جولة ${ar(round)}/٤`;
        while (seq.length < round + 2) seq.push(Math.random() * 4 | 0);
        tip.textContent = "انتبه…";
        seq.forEach((v, k) => later(() => flash(v), 600 + k * 520));
        later(() => { accepting = true; tip.textContent = "دورك!"; }, 600 + seq.length * 520);
      }
      btns.forEach(b => b.addEventListener("pointerdown", e => {
        e.preventDefault(); if (!accepting || ended) return;
        const i = +b.dataset.i; flash(i);
        if (i !== seq[input]) { ended = true; accepting = false; SND.play("buzz"); return later(() => finish(el, (round - 1) / 4, `السيرفر رجع… تقريبًا. ${ar(round - 1)} من ٤ جولات`, res, stop), 400); }
        input++;
        if (input === seq.length) {
          accepting = false;
          if (round === 4) { ended = true; unlock("simon"); return later(() => finish(el, 1, "ولا غلطة. أبو نايف ابتسم (نادر)", res, stop), 500); }
          tip.textContent = "صح!"; later(next, 800);
        }
      }));
      const stop = () => timers.forEach(clearTimeout);
      skip(el, res, stop);
      later(next, 500);
    });
  }
  return { run: (k, o) => ({ bugs, pour, bingo, simon }[k] || bugs)(o) };
})();

UI.endSlot = async function () {
  if (G.stress >= 100) return UI.ending("burnout");
  G.slot++;
  if (G.day === 10 && G.slot === 2) return UI.runLaunch();
  if (G.slot > 3) {
    night();
    if (G.day === 6 && !G.weekend) { G.phase = "weekend"; save(); return UI.weekend(); }
    save(); await UI.dayCard();
  }
  save(); UI.beginSlot();
};
UI.beginSlot = async function () {
  G.phase = "play"; curLoc = null; busy = true;
  UI.renderPlay();
  const got = deliver();
  if (got.length) {
    SND.play("notify"); UI.renderHud();
    const t = got.find(x => x.type === "text");
    UI.toast(t ? `رسالة جديدة من ${CH[t.from].n}` : "إيميل جديد", ART.icon(t ? "chat" : "mail"));
  }
  if (G.slot === 0 && !G.evDone[G.day]) {
    G.evDone[G.day] = 1; save();
    const n = (EVD[G.day] || []).map(byId).find(x => x && ok(x));
    if (n) { await sleep(350); const r = await UI.runNode(n, { event: true }); if (G.phase !== "play") return; if (r && r.skip) { busy = false; return UI.endSlot(); } }
  } else {
    const r = pickRandomEvent();
    if (r) { await sleep(500); await UI.runNode(r, { event: true }); if (G.phase !== "play") return; }
  }
  if (G.slot === 3) {
    const c = pickIncomingCall();
    if (c) {
      await sleep(700);
      const yes = await UI.incoming();
      G.callDay = G.day;
      if (yes) { G.st.calls++; await UI.runNode(c, { call: true }); checkAch(); }
      else { applyFx({ mom: -2 }); UI.toast("الوالدة: «طيب. لا تتصل بعد.» 🙂"); }
    }
  }
  busy = false; save(); UI.renderPlay();
};
