function parseLine(line, def) {
  if (line[0] === "#") return { sp: "nar", ex: "n", t: line.slice(1) };
  if (line[0] === "@") return { sp: "me", ex: "n", t: line.slice(1) };
  let sp = def, ex = "n", t = line;
  const m = t.match(/^([a-z]+):([\s\S]*)$/); if (m && CH[m[1]]) { sp = m[1]; t = m[2]; }
  const e = t.match(/^([nhasx])\|([\s\S]*)$/); if (e) { ex = e[1]; t = e[2]; }
  return { sp, ex, t };
}
function addFact(npc, f) { if (!f || !CH[npc]) return; G.facts[npc] = [...new Set([...(G.facts[npc] || []), f])]; }

/* ---------- VN overlay ---------- */
function vnOpen() {
  const o = overlay("ov vn dim", `<div class="ov-inner"><button class="vn-skip" id="vnSkip">تسريع ⏩</button><div class="vn-por" id="vnP"></div><div id="vnO"></div>
    <div class="vn-box" id="vnBox" role="button" tabindex="0" aria-label="التالي"><div class="vn-name" id="vnN" hidden></div><div class="vn-text" id="vnT" aria-live="polite"></div><div class="vn-next" id="vnX" hidden></div></div></div>`);
  o.querySelector("#vnSkip").onclick = e => { e.stopPropagation(); o._fast = true; SND.play("swoosh"); o._skipNow && o._skipNow(); };
  SND.play("open");
  return o;
}
function setPortrait(o, sp, ex) {
  const P = o.querySelector("#vnP");
  if (P.dataset.id === sp && P.dataset.ex === ex) return;
  const swap = P.dataset.id !== sp;
  P.innerHTML = sp === "group" ? ART.groupIcon() : ART.portrait(sp, ex);
  P.dataset.id = sp; P.dataset.ex = ex;
  const anim = c => { P.classList.remove(c); void P.offsetWidth; P.classList.add(c); };
  if (swap) anim("hop");
  if (ex === "a" && !swap) { anim("shake"); haptic(30); }
  if (ex === "x") SND.play("pop");
}
function say(o, ln) {
  return new Promise(resolve => {
    const P = o.querySelector("#vnP"), Nm = o.querySelector("#vnN"), T = o.querySelector("#vnT"), X = o.querySelector("#vnX"), box = o.querySelector("#vnBox");
    if (ln.sp === "nar") { Nm.hidden = true; P.classList.add("dimmed"); T.className = "vn-text narr"; }
    else if (ln.sp === "me") { Nm.hidden = false; Nm.style.setProperty("--c", "#8CC4F2"); Nm.textContent = G.name; P.classList.add("dimmed"); T.className = "vn-text me"; }
    else {
      const c = CH[ln.sp]; Nm.hidden = false; Nm.style.setProperty("--c", c.col);
      Nm.innerHTML = `${c.n}${G.aff[ln.sp] != null && ln.sp !== "mom" ? `<small>${level(A(ln.sp))}</small>` : ""}`;
      P.classList.remove("dimmed"); T.className = "vn-text"; setPortrait(o, ln.sp, ln.ex);
    }
    const text = ln.t, voice = CH[ln.sp] && CH[ln.sp].v, spd = [40, 24, 10][SET.speed == null ? 1 : SET.speed];
    let i = 0, done = false, timer;
    T.textContent = ""; X.hidden = true;
    if (voice) P.classList.add("talk");
    const complete = () => { if (done) return; done = true; clearTimeout(timer); T.textContent = text; P.classList.remove("talk"); X.hidden = false; };
    const tick = () => {
      if (done) return;
      i++; T.textContent = text.slice(0, i);
      const ch = text[i - 1];
      if (voice && ch !== " " && i % 2 === 0) SND.voice(voice);
      else if (ln.sp === "me" && i % 3 === 0) SND.play("type");
      if (i >= text.length) complete(); else timer = setTimeout(tick, /[.،؟!…]/.test(ch) ? spd * 6 : spd);
    };
    const finish = () => { cleanup(); resolve(); };
    const tap = e => { if (e) e.stopPropagation(); if (!done) return complete(); SND.play("click"); finish(); };
    const key = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(); } };
    function cleanup() { box.removeEventListener("click", tap); document.removeEventListener("keydown", key); o._skipNow = null; }
    box.addEventListener("click", tap); document.addEventListener("keydown", key);
    o._skipNow = () => { complete(); setTimeout(finish, 80); };
    if (o._fast) { complete(); setTimeout(finish, 90); } else timer = setTimeout(tick, 80);
  });
}
function choose(o, choices) {
  return new Promise(resolve => {
    o._fast = false;
    const box = o.querySelector("#vnO");
    box.className = "vn-opts";
    box.innerHTML = choices.map((c, i) => `<button class="opt" data-i="${i}"><span>${c.t}</span></button>`).join("");
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => { SND.play("select"); box.innerHTML = ""; box.className = ""; resolve(choices[+b.dataset.i]); });
    box.querySelector(".opt").focus();
  });
}
function emote(o, k) {
  if (!k) return;
  const e = document.createElement("div"); e.className = "vn-emo"; e.innerHTML = ART.emote(k);
  o.querySelector(".ov-inner").appendChild(e); setTimeout(() => e.remove(), 1300);
}
function showFx(o, ch) {
  if (!ch || !ch.length) return Promise.resolve();
  const up = ch.some(c => c.npc && c.v > 0), down = ch.some(c => c.npc && c.v < 0);
  emote(o, up ? "heart" : down ? "rain" : ch.some(c => c.k === "stress" && c.v > 0) ? "sweat" : null);
  if (up) { const P = o.querySelector("#vnP"); P.classList.remove("hop"); void P.offsetWidth; P.classList.add("hop"); }
  UI.floatFx(ch);
  const T = o.querySelector("#vnT");
  T.insertAdjacentHTML("beforeend", `<div class="fx-row">${ch.map((c, i) => `<span class="chip ${c.good ? "up" : "down"}" style="animation-delay:${i * 0.07}s">${c.t} ${c.v > 0 ? "+" : "−"}${ar(Math.abs(c.v))}</span>`).join("")}</div>`);
  return new Promise(res => {
    const box = o.querySelector("#vnBox");
    const go = e => { e && e.stopPropagation(); box.removeEventListener("click", go); document.removeEventListener("keydown", k); SND.play("click"); res(); };
    const k = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    setTimeout(() => { box.addEventListener("click", go); document.addEventListener("keydown", k); }, 250);
  });
}
function closeVN(o) { SND.play("close"); o.remove(); UI.renderHud(); }

async function runVN(node, opts = {}) {
  const o = opts.o || vnOpen(), npc = node.npc, res = { skip: false };
  G.seen[node.id] = 1; if (CH[npc] && G.aff[npc] != null) G.met[npc] = 1;
  for (const l of node.L) await say(o, parseLine(l, npc));
  if (node.c && node.c.length) {
    const c = await choose(o, node.c);
    await say(o, { sp: "me", t: c.t.replace(/^\(|\)$/g, "") });
    addFact(npc, node.fact);
    for (const l of (c.r || [])) await say(o, parseLine(l, npc));
    let ch = applyFx(c.fx);
    if (c.fx && c.fx.mg) {
      o.style.visibility = "hidden";
      const sc = await MG.run(c.fx.mg.k);
      o.style.visibility = "";
      ch = ch.concat(applyFx(sc >= 0.6 ? c.fx.mg.win : c.fx.mg.lose));
    }
    if (c.fx && c.fx.skip) res.skip = true;
    if (G.aff[npc] != null && !opts.event) ch = ch.concat(applyFx({ stress: -2 }));
    await showFx(o, ch);
    if (c.next && byId(c.next)) { const r2 = await runVN(byId(c.next), { ...opts, o }); res.skip = res.skip || r2.skip; }
  }
  if (!opts.o) closeVN(o);
  save();
  return res;
}
UI.runNode = function (node, opts = {}) { return node.mode === "chat" ? runChat(node) : runVN(node, opts); };

/* ---------- visiting a person: hub of talk / ask / gift ---------- */
function hub(o, items) {
  return new Promise(resolve => {
    const box = o.querySelector("#vnO");
    box.className = "hub";
    box.innerHTML = items.map(it => `<button class="opt ${it.k === "bye" ? "bye" : ""}" data-k="${it.k}">${ART.icon(it.ic)}<span>${it.t}</span></button>`).join("");
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => { SND.play(b.dataset.k === "bye" ? "back" : "select"); box.innerHTML = ""; box.className = ""; resolve(b.dataset.k); });
    box.querySelector(".opt").focus();
  });
}
function picker(o, html) {
  return new Promise(resolve => {
    const box = o.querySelector("#vnO");
    box.className = "picker";
    box.innerHTML = html + `<button data-v="">${ART.icon("back")}<span>رجوع</span></button>`;
    box.querySelectorAll("button").forEach(b => b.onclick = () => { SND.play(b.dataset.v ? "select" : "back"); box.innerHTML = ""; box.className = ""; resolve(b.dataset.v || null); });
  });
}
const pickPerson = (o, npc) => picker(o, OFFICE.filter(k => k !== npc).map(k => `<button data-v="${k}">${ART.portrait(k, "n", { round: 1 })}<span>${CH[k].n}</span></button>`).join(""));
const pickItem = o => picker(o, Object.entries(G.inv).filter(([k, v]) => v > 0).map(([k, v]) => `<button data-v="${k}">${ART.item(k)}<span>${ITEMS[k].n}</span><em class="num">×${ar(v)}</em></button>`).join(""));
function giftLine(npc, it, r) {
  const n = ITEMS[it].n;
  if (npc === "richard") return r.d >= 15 ? "No way! How did you know? My favorite!" : r.d >= 8 ? "Lovely! Thank you, habibi." : r.d < 0 ? "Oh… thanks. Not really my thing." : "Thank you, that's kind.";
  return r.d >= 15 ? `${n}؟! كيف عرفت؟ هذا المفضّل عندي!` : r.d >= 8 ? `الله! ${n}. ذوقك حلو، شكرًا.` : r.d < 0 ? `…${n}؟ شكرًا. بس لا.` : "شكرًا. لطيف منك.";
}
UI.visit = async function (npc) {
  if (busy) return; busy = true;
  const o = vnOpen(), did = { talk: 0, ask: 0, gift: 0 };
  const tier = A(npc) < 0 ? 0 : A(npc) < 35 ? 1 : 2;
  await say(o, parseLine(GREET[npc][tier], npc));
  for (;;) {
    const items = [];
    if (!did.talk) items.push({ k: "talk", ic: "talk", t: hasNew(npc, curLoc) ? "سولف · عنده جديد" : "سولف" });
    if (!did.ask) items.push({ k: "ask", ic: "ask", t: "اسأل عن شخص" });
    if (!did.gift && G.giftDay[npc] !== G.day && Object.values(G.inv).some(v => v > 0)) items.push({ k: "gift", ic: "gift", t: "قدّم هدية" });
    items.push({ k: "bye", ic: "bye", t: did.talk || did.ask || did.gift ? "مع السلامة" : "رجوع" });
    const k = await hub(o, items);
    if (k === "bye") break;
    if (k === "talk") { did.talk = 1; const n = pickTalk(npc, curLoc); if (n) await runVN(n, { o }); else await say(o, parseLine("ما عندي جديد. نتكلم بعدين.", npc)); }
    if (k === "ask") {
      const b = await pickPerson(o, npc);
      if (b) { did.ask = 1; const r = askAbout(npc, b); await say(o, { sp: "me", t: `وش رأيك في ${CH[b].n}؟` }); await say(o, parseLine(r.line, npc)); UI.renderHud(); }
    }
    if (k === "gift") {
      const it = await pickItem(o);
      if (it) {
        did.gift = 1; SND.play("gift");
        const r = giveGift(npc, it);
        await say(o, { sp: "me", t: `جبت لك ${ITEMS[it].n}.` });
        await say(o, { sp: npc, ex: r.ex, t: giftLine(npc, it, r) });
        emote(o, r.emo); await showFx(o, r.ch);
      }
    }
  }
  closeVN(o);
  busy = false;
  if (did.talk || did.ask || did.gift) { save(); UI.endSlot(); } else UI.renderPlay();
};

/* ---------- chat (group events & phone threads) ---------- */
function phoneHead(id, sub, back) {
  const c = CH[id] || { n: id, r: "" };
  return `<div class="ph-head">${back ? `<button class="x" id="phBack" aria-label="رجوع">${ART.icon("back")}</button>` : ""}${id === "group" || id === "bank" ? ART.groupIcon() : ART.portrait(id, "n", { round: 1 })}<div><b>${c.n}</b><small>${sub || c.r}</small></div><button class="x" id="phX" aria-label="إغلاق">${ART.icon("close")}</button></div>`;
}
function bubbleHTML(l) {
  if (l[0] === "#") return `<div class="bub sys">${l.slice(1)}</div>`;
  if (l[0] === "@") return `<div class="bub me">${l.slice(1)}</div>`;
  const p = parseLine(l, "group");
  return `<div class="bub"><span class="who" style="color:${CH[p.sp].col}">${CH[p.sp].n}</span>${p.t}</div>`;
}
async function bubble(pb, l, fast) {
  if (!fast && l[0] !== "@" && l[0] !== "#") {
    const ty = document.createElement("div"); ty.className = "typing"; ty.innerHTML = "<i></i><i></i><i></i>";
    pb.appendChild(ty); pb.scrollTop = pb.scrollHeight;
    await sleep(Math.min(1100, 380 + l.length * 14)); ty.remove();
  }
  pb.insertAdjacentHTML("beforeend", bubbleHTML(l)); pb.scrollTop = pb.scrollHeight;
  if (!fast) { SND.play(l[0] === "@" ? "type" : "pop"); await sleep(l[0] === "#" ? 500 : 260); }
}
function replies(foot, choices) {
  return new Promise(res => {
    foot.innerHTML = choices.map((c, i) => `<button class="reply" data-i="${i}">${c.t}</button>`).join("");
    foot.querySelectorAll(".reply").forEach(b => b.onclick = () => { SND.play("select"); foot.innerHTML = ""; res(choices[+b.dataset.i]); });
  });
}
async function runChat(node) {
  const o = overlay("ov phone", `<div class="ov-inner phone">${phoneHead(node.npc)}<div class="ph-body" id="pb"></div><div class="ph-foot" id="pf"></div></div>`);
  o.querySelector("#phX").hidden = true;
  SND.play("notify"); G.seen[node.id] = 1;
  const pb = o.querySelector("#pb"), pf = o.querySelector("#pf");
  for (const l of node.L) await bubble(pb, l);
  if (node.c) {
    const c = await replies(pf, node.c);
    await bubble(pb, "@" + c.t);
    for (const l of (c.r || [])) await bubble(pb, l);
    const ch = applyFx(c.fx); UI.floatFx(ch); UI.renderHud();
  }
  await new Promise(r => { pf.innerHTML = `<button class="btn">تمام</button>`; pf.querySelector("button").onclick = () => { SND.play("close"); r(); }; });
  o.remove(); save();
  return {};
}

/* ---------- phone ---------- */
UI.phone = function (start) {
  busy = true; SND.play("open");
  const o = overlay("ov phone", `<div class="ov-inner phone" id="ph"></div>`), ph = o.querySelector("#ph");
  const close = () => { SND.play("close"); o.remove(); busy = false; UI.renderPlay(); };
  const bind = back => { ph.querySelector("#phX").onclick = close; const b = ph.querySelector("#phBack"); if (b) b.onclick = () => { SND.play("back"); back(); }; };
  const threads = () => { const t = {}; G.texts.forEach(x => { const d = TEXTS.find(y => y.id === x.id); (t[d.from] = t[d.from] || []).push({ x, d }); }); return t; };
  function home() {
    const ut = unreadTexts(), um = unreadMails(), canCall = G.slot === 3 && G.callDay !== G.day;
    ph.innerHTML = `<div class="ph-head"><div><b>جوالك</b><small>${DAYN[(G.day - 1) % 5]} · ${SLOTT[G.slot]}</small></div><button class="x" id="phX" aria-label="إغلاق">${ART.icon("close")}</button></div>
      <div class="ph-home"><div class="ph-clock"><b class="num">${SLOTT[G.slot]}</b><small>${ar(G.money)} ر.س في الحساب</small></div>
      <button class="app" data-a="chats"><i style="background:#2E9C6E">${ART.icon("chat")}</i>الرسائل${ut ? `<span class="badge num">${ar(ut)}</span>` : ""}</button>
      <button class="app" data-a="mail"><i style="background:#3466C2">${ART.icon("mail")}</i>البريد${um ? `<span class="badge num">${ar(um)}</span>` : ""}</button>
      <button class="app" data-a="store"><i style="background:#C98E1C">${ART.icon("store")}</i>طلبك بضغطة</button>
      <button class="app" data-a="call" ${canCall ? "" : "disabled"}><i style="background:#57C78C">${ART.icon("call")}</i>${canCall ? "اتصل بالوالدة" : "الاتصال بالليل"}</button>
      <button class="app" data-a="log"><i style="background:#7A5BA8">${ART.icon("note")}</i>السجل</button></div>`;
    bind(); ph.querySelectorAll(".app").forEach(b => b.onclick = () => { if (b.disabled) return; SND.play("click"); ({ chats, mail, store, call, log })[b.dataset.a](); });
  }
  function chats() {
    const t = threads();
    ph.innerHTML = `${phoneHead("group", "الرسائل", 1).replace(ART.groupIcon(), "")}<div class="ph-body" style="padding:0;gap:0">${Object.entries(t).reverse().map(([from, arr]) => { const last = arr[arr.length - 1].d.L.slice(-1)[0], un = arr.some(z => !z.x.read); return `<button class="list-row" data-f="${from}">${from === "group" || from === "bank" ? ART.groupIcon() : ART.portrait(from, "n", { round: 1 })}<div class="t"><b>${CH[from].n}</b><span>${parseLine(last, from).t}</span></div>${un ? `<i class="unread"></i>` : ""}</button>`; }).join("") || `<p class="mg-tip">ما فيه رسائل للحين.</p>`}</div>`;
    ph.querySelector(".ph-head b").textContent = "الرسائل";
    bind(home); ph.querySelectorAll(".list-row").forEach(b => b.onclick = () => { SND.play("click"); thread(b.dataset.f); });
  }
  async function thread(from) {
    const arr = threads()[from];
    ph.innerHTML = `${phoneHead(from, "", 1)}<div class="ph-body" id="pb"></div><div class="ph-foot" id="pf"></div>`;
    bind(chats);
    const pb = ph.querySelector("#pb"), pf = ph.querySelector("#pf");
    for (const { x, d } of arr) { for (const l of d.L) await bubble(pb, l, true); if (x.done && x.pick != null) { const c = d.c[x.pick]; await bubble(pb, "@" + c.t, true); for (const l of (c.r || [])) await bubble(pb, l, true); } x.read = true; }
    UI.renderHud();
    const pending = arr.find(z => !z.x.done);
    if (pending) {
      const c = await replies(pf, pending.d.c);
      pending.x.done = true; pending.x.pick = pending.d.c.indexOf(c);
      await bubble(pb, "@" + c.t);
      for (const l of (c.r || [])) await bubble(pb, l);
      UI.floatFx(applyFx(c.fx)); save(); thread(from);
    } else pf.innerHTML = `<div class="mg-tip" style="padding:0">ما فيه رد مطلوب.</div>`;
  }
  function mail() {
    ph.innerHTML = `<div class="ph-head"><button class="x" id="phBack">${ART.icon("back")}</button><div><b>البريد</b><small>${ar(G.mails.length)} رسالة</small></div><button class="x" id="phX">${ART.icon("close")}</button></div>
      <div class="ph-body" style="padding:0;gap:0">${G.mails.map(m => { const d = EMAILS.find(e => e.id === m.id); return `<button class="list-row" data-m="${m.id}"><div class="t"><b>${d.subj}</b><span>${d.from}</span></div>${m.read ? "" : `<i class="unread"></i>`}</button>`; }).join("") || `<p class="mg-tip">البريد فاضي. مؤقتًا.</p>`}</div>`;
    bind(home); ph.querySelectorAll(".list-row").forEach(b => b.onclick = () => { SND.play("click"); openMail(b.dataset.m); });
  }
  function openMail(id) {
    const m = G.mails.find(x => x.id === id), d = EMAILS.find(e => e.id === id);
    m.read = true; UI.renderHud();
    ph.innerHTML = `<div class="ph-head"><button class="x" id="phBack">${ART.icon("back")}</button><div><b>البريد</b></div><button class="x" id="phX">${ART.icon("close")}</button></div>
      <div class="ph-body mail"><h3>${d.subj}</h3><div class="from">من: ${d.from}</div>${d.body.map(p => `<p>${p}</p>`).join("")}<div id="mres"></div></div><div class="ph-foot" id="pf"></div>`;
    bind(mail);
    const pf = ph.querySelector("#pf");
    if (d.c && !m.done) {
      pf.innerHTML = d.c.map((c, i) => `<button class="reply" data-i="${i}">${c.t}</button>`).join("");
      pf.querySelectorAll(".reply").forEach(b => b.onclick = () => { const c = d.c[+b.dataset.i]; m.done = true; SND.play("swoosh"); pf.innerHTML = ""; ph.querySelector("#mres").innerHTML = `<p class="bub sys" style="max-width:100%">تم الإرسال: ${c.t}${c.r ? "<br>" + c.r.join(" ") : ""}</p>`; UI.floatFx(applyFx(c.fx)); UI.renderHud(); save(); });
    } else pf.remove();
  }
  function store() {
    ph.innerHTML = `<div class="ph-head"><button class="x" id="phBack">${ART.icon("back")}</button><div><b>طلبك بضغطة</b><small>التوصيل فوري. التطبيق اللي تبنيه… بس شغّال.</small></div><button class="x" id="phX">${ART.icon("close")}</button></div>
      <div class="ph-body" style="padding:0;gap:0"><div class="list-row"><div class="t"><b>رصيدك</b></div><b class="num" id="stM">${ar(G.money)} ر.س</b></div>
      ${Object.entries(ITEMS).map(([k, it]) => `<div class="shop-item">${ART.item(k)}<div class="t"><b>${it.n}</b><span>${it.d} · عندك ${ar(G.inv[k] || 0)}</span></div><button class="buy num" data-k="${k}" ${G.money < it.p ? "disabled" : ""}>${ar(it.p)} ر.س</button></div>`).join("")}
      <p class="mg-tip">الهدايا تقدّمها لما تكلّم أحد. كل شخص له ذوق.</p></div>`;
    bind(home);
    ph.querySelectorAll(".buy").forEach(b => b.onclick = () => { if (buy(b.dataset.k)) { SND.play("coin"); haptic(15); save(); UI.renderHud(); store(); } else SND.play("buzz"); });
  }
  async function call() {
    o.remove(); G.callDay = G.day; G.st.calls++; checkAch();
    const n = pickTalk("mom");
    SND.ring(true); await sleep(1400); SND.ring(false);
    if (n) await UI.runNode(n, { call: true });
    busy = false; save(); UI.endSlot();
  }
  function log() {
    ph.innerHTML = `<div class="ph-head"><button class="x" id="phBack">${ART.icon("back")}</button><div><b>السجل</b><small>آخر الأحداث</small></div><button class="x" id="phX">${ART.icon("close")}</button></div>
      <div class="ph-body">${G.log.map(l => `<div class="bub sys" style="text-align:right;align-self:stretch;max-width:100%">اليوم ${ar(l.d)} · ${SLOTN[l.s]}: ${l.t}${l.ch.length ? `<br><small>${l.ch.map(c => `${c.t} ${c.v > 0 ? "+" : "−"}${ar(Math.abs(c.v))}`).join("، ")}</small>` : ""}</div>`).join("") || `<p class="mg-tip">ما صار شي للحين.</p>`}</div>`;
    bind(home);
  }
  ({ chats, mail, store, log }[start] || home)();
};

UI.incoming = function () {
  return new Promise(res => {
    const o = overlay("incoming", `<div class="ring-por">${ART.portrait("mom", "h", { round: 1 })}</div><h2>الوالدة</h2><p>مكالمة واردة…</p>
      <div class="btns"><button class="no" aria-label="رفض">${ART.icon("call")}</button><button class="yes" aria-label="رد">${ART.icon("call")}</button></div>`);
    SND.ring(true);
    const end = v => { SND.ring(false); SND.play(v ? "select" : "back"); o.remove(); res(v); };
    o.querySelector(".yes").onclick = () => end(true);
    o.querySelector(".no").onclick = () => end(false);
  });
};

/* ---------- sheets ---------- */
UI.sheet = function (kind) {
  busy = true; SND.play("open");
  const o = overlay("ov dim", `<div class="ov-inner"><div class="sheet"><div class="sheet-h"><h2></h2><button class="x" id="shX" aria-label="إغلاق">${ART.icon("close")}</button></div><div class="sheet-b" id="shB"></div></div></div>`);
  const h = o.querySelector("h2"), b = o.querySelector("#shB");
  const close = () => { SND.play("close"); o.remove(); busy = false; if (G && G.phase === "play") UI.renderPlay(); };
  o.querySelector("#shX").onclick = close;
  o.addEventListener("click", e => { if (e.target === o || e.target.classList.contains("ov-inner")) close(); });
  if (kind === "rel") {
    h.textContent = "العلاقات";
    b.innerHTML = NPCS.map(id => { const a = A(id), full = Math.max(0, Math.min(5, Math.round(a / 20)));
      return `<div class="rel">${ART.portrait(id, a >= 35 ? "h" : a < 0 ? "a" : "n", { round: 1 })}<div class="t"><div class="top"><b>${CH[id].n}</b><span class="num">${level(a)} · ${a > 0 ? "+" : ""}${ar(a)}</span></div><span style="color:var(--muted);font-size:12.5px">${CH[id].r}</span>
      <div class="hearts">${Array.from({ length: 5 }, (_, i) => `<span style="opacity:${i < full ? 1 : 0.18}">${ART.emote(a < 0 && i === 0 ? "rain" : "heart")}</span>`).join("")}</div>
      ${(G.facts[id] || []).length ? `<ul class="facts">${G.facts[id].map(f => `<li>${f}</li>`).join("")}</ul>` : `<span style="color:var(--muted);font-size:12.5px">${G.met[id] ? "تعرف عنه القليل. سولف أكثر." : "ما تعرفتوا للحين."}</span>`}</div></div>`; }).join("");
  } else if (kind === "bag") {
    h.textContent = "الحقيبة";
    const inv = Object.entries(G.inv).filter(([, v]) => v > 0);
    b.innerHTML = (inv.length ? inv.map(([k, v]) => `<div class="shop-item" style="padding-inline:0">${ART.item(k)}<div class="t"><b>${ITEMS[k].n} <span class="num">×${ar(v)}</span></b><span>${ITEMS[k].d}</span></div></div>`).join("") : `<p class="mg-tip">الحقيبة فاضية.</p>`) +
      `<p class="mg-tip">قدّم الهدايا لما تكلم أحد. كل شخص يحب شي، ويكره شي.</p><button class="btn" id="toStore">افتح «طلبك بضغطة»</button>`;
    b.querySelector("#toStore").onclick = () => { o.remove(); UI.phone("store"); };
  } else if (kind === "ach") {
    h.textContent = "الإنجازات";
    b.innerHTML = `<b>النهايات (${ar(Object.keys(META.ends).length)}/١٠)</b><div class="ends">${END_ORDER.map(k => `<span class="${META.ends[k] ? "got" : ""}">${META.ends[k] ? ENDS[k].h : "؟؟؟"}</span>`).join("")}</div>` +
      Object.entries(ACH).map(([k, [n, d]]) => `<div class="ach ${META.ach[k] ? "got" : ""}"><i>${ART.icon(META.ach[k] ? "trophy" : "lock")}</i><div><b>${n}</b><span>${d}</span></div></div>`).join("");
  } else {
    h.textContent = "الإعدادات";
    const row = (k, ic, t) => `<div class="set-row"><label>${ART.icon(ic)}${t}</label><button class="tog ${SET[k] ? "on" : ""}" data-k="${k}" role="switch" aria-checked="${!!SET[k]}" aria-label="${t}"></button></div>`;
    b.innerHTML = row("music", "music", "الموسيقى") + row("sfx", "sound", "المؤثرات والأصوات") + row("haptics", "vibe", "الاهتزاز") +
      `<div class="set-row"><label>${ART.icon("chat")}سرعة النص</label><div class="seg">${["بطيء", "عادي", "سريع"].map((t, i) => `<button data-s="${i}" class="${(SET.speed == null ? 1 : SET.speed) === i ? "on" : ""}">${t}</button>`).join("")}</div></div>
      <div style="display:grid;gap:10px;margin-top:18px"><button class="btn ghost" id="sMenu">القائمة الرئيسية</button><button class="btn danger" id="sReset">ابدأ دوام جديد</button></div>`;
    b.querySelectorAll(".tog").forEach(t => t.onclick = () => { const k = t.dataset.k; SET[k] = !SET[k]; t.classList.toggle("on", SET[k]); t.setAttribute("aria-checked", SET[k]); saveSet(); SND.init(); SND.apply(); SND.play("click"); if (k === "haptics" && SET.haptics) haptic(40); });
    b.querySelectorAll(".seg button").forEach(s => s.onclick = () => { SET.speed = +s.dataset.s; saveSet(); b.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === s)); SND.play("click"); });
    b.querySelector("#sMenu").onclick = () => { save(); o.remove(); busy = false; UI.title(); };
    b.querySelector("#sReset").onclick = e => { const btn = e.currentTarget; if (btn.dataset.sure) { clearSave(); o.remove(); busy = false; UI.title(); } else { btn.dataset.sure = 1; btn.textContent = "متأكد؟ اضغط مرة ثانية"; SND.play("buzz"); } };
  }
};

/* ---------- boot ---------- */
function boot(data) {
  document.addEventListener("pointerdown", () => SND.init(), { once: true });
  if (data && data.G) { G = data.G; UI.resume(); } else UI.title();
}
window.claude?.hot?.snapshot?.(() => ({ G }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
